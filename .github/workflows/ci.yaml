name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings" 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v2

    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-machete
    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-deny

    - name: Build
      run: cargo build --all-features

    - name: Run tests
      run: cargo test --all-features

    - name: Clippy
      run: cargo clippy --all-features

    - name: Fmt
      run: cargo fmt -- --check

    - name: Unused dependencies
      run: cargo machete

    - name: Check dependencies licences are compatible
      run: cargo deny check licenses
